# 站点基础信息配置（Keep 主题要求放在 base_info 节点下）
base_info:
  primary_color: "#0066CC"
  title: "wzablog"
  author: "wza"
  avatar: /img/bg.jpg
  logo: /img/bg.jpg
  favicon: /img/bg.jpg

# 导航菜单（key: 路径 || 图标）
menu:
  home: / || fa-solid fa-home
  archives: /archives || fa-solid fa-box-archive
  photos: /gallery || fa-solid fa-image

# 首页首屏背景图（需 enable: true 才会显示）
first_screen:
  enable: true
  description: "this website is used to record|| my life and share interesting things"
  background_img: /img/background.jpg
  background_img_dark: /img/background.jpg

inject:
  enable: true
  css:
    - /css/custom.css

comment:
  enable: true
  use: twikoo            # ⚠️ 关键点 1：Keep 主题用的是 `use`，不是 `type`！

  twikoo:
    env_id: https://twikoo-iota-ruby.vercel.app   # ⚠️ 关键点 2：这里是 `env_id`（带下划线），不是 `envId`！
    region:
    version: 1.6.39
