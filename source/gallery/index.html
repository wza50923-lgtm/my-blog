<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>时光回忆录</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1410}
body{font-family:Georgia,serif;color:#d4c5a9}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a2018 0%,#1a1410 50%,#0f0b08 100%)}
.bg-layer{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 20%,rgba(180,140,100,0.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(200,160,120,0.04) 0%,transparent 50%),repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(210,180,140,0.015) 2px,rgba(210,180,140,0.015) 4px);transition:transform 1.5s;z-index:0}
.grain-overlay{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px;animation:grainShift 0.3s steps(4) infinite}
@keyframes grainShift{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}}
.scanlines{position:fixed;inset:0;z-index:89;pointer-events:none;opacity:0.02;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.2) 1px,rgba(0,0,0,0.2) 2px)}
#particleCanvas{position:fixed;inset:0;z-index:1;pointer-events:none}
.main-content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 80px 60px}
.image-area{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;max-width:1000px;height:62vh}
.main-image{flex:0 0 auto;height:100%;max-width:78%;position:relative;z-index:5}
.photo-frame{position:relative;height:100%;padding:10px 10px 28px 10px;background:#f5ede1;box-shadow:0 4px 30px rgba(0,0,0,0.5);border-radius:1px;overflow:hidden;transition:transform 0.5s,opacity 0.5s,filter 0.5s}
.photo-frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:1px;position:relative;z-index:1;filter:sepia(0.15)saturate(0.85)contrast(1.05)}
.photo-vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.5) 100%);mix-blend-mode:multiply}.photo-frame::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 1px 2px rgba(0,0,0,0.06);border-radius:1px}
.preview{flex:0 0 auto;width:100px;height:70px;opacity:0.25;transition:all 0.5s;position:relative;z-index:1}
.preview-img-wrap{width:100%;height:100%;padding:3px 3px 8px;background:#f5ede1;box-shadow:0 2px 12px rgba(0,0,0,0.3);border-radius:1px;overflow:hidden}
.preview-img-wrap img{width:100%;height:100%;object-fit:cover;filter:sepia(0.3)saturate(0.7)blur(1px);opacity:0.5}
.info-section{text-align:center;margin-top:16px;position:relative;width:100%;max-width:600px}
.photo-counter{font-size:13px;color:#8b7355;letter-spacing:1px;margin-bottom:4px}
.photo-title{font-size:26px;font-style:italic;color:#e8d5b0;letter-spacing:1px;min-height:1.4em}
.photo-date{font-size:17px;color:#a08970}
.year-label{font-size:72px;font-weight:700;color:rgba(180,150,110,0.06);position:absolute;left:50%;transform:translateX(-50%);top:-20px;white-space:nowrap;letter-spacing:8px;pointer-events:none}
.timeline-section{position:fixed;bottom:14px;left:0;right:0;z-index:30;padding:0 60px}
.timeline-container{position:relative;width:100%;height:36px;display:flex;align-items:center}
.timeline-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(196,169,125,0.2) 10%,rgba(196,169,125,0.2) 90%,transparent);top:50%}
.timeline-dots{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 4%}
.timeline-dot{width:8px;height:8px;border-radius:50%;background:rgba(196,169,125,0.2);border:1px solid rgba(196,169,125,0.15);cursor:pointer;transition:all 0.4s;position:relative;flex-shrink:0}
.timeline-dot:hover{background:rgba(196,169,125,0.4);transform:scale(1.4)}
.timeline-dot.active{background:#c4a97d;border-color:#c4a97d;transform:scale(1.5);box-shadow:0 0 12px rgba(196,169,125,0.3)}
.timeline-dot .dot-year{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(196,169,125,0.35);white-space:nowrap;pointer-events:none}
.timeline-dot.active .dot-year{color:rgba(196,169,125,0.7)}
.nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:25;background:rgba(26,20,16,0.5);border:1px solid rgba(196,169,125,0.2);color:rgba(196,169,125,0.5);width:44px;height:80px;cursor:pointer;font-size:32px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;user-select:none}
.nav-btn:hover{background:rgba(196,169,125,0.1);border-color:rgba(196,169,125,0.4);color:#c4a97d}
.nav-prev{left:0;border-radius:0 5px 5px 0}
.nav-next{right:0;border-radius:5px 0 0 5px}
.upload-btn{position:fixed;bottom:85px;right:25px;z-index:40;width:48px;height:48px;border-radius:50%;border:2px solid rgba(196,169,125,0.35);background:rgba(26,20,16,0.85);color:#c4a97d;font-size:24px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;line-height:1}
.upload-btn:hover{background:rgba(196,169,125,0.12);border-color:#c4a97d;transform:scale(1.1);box-shadow:0 0 18px rgba(196,169,125,0.15)}
.manage-btn{position:fixed;top:16px;right:16px;z-index:40;width:36px;height:36px;border-radius:50%;border:1px solid rgba(196,169,125,0.2);background:rgba(26,20,16,0.6);color:#8b7355;font-size:16px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.manage-btn:hover{color:#c4a97d;border-color:rgba(196,169,125,0.4)}
.light-leak{position:fixed;inset:0;z-index:46;pointer-events:none;opacity:0;transition:opacity 0.08s}
.light-leak.active{opacity:1;transition:opacity 0.04s}
.shutter-flash{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0;transition:opacity 0.05s}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all 0.35s;backdrop-filter:blur(4px)}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:#2a2018;border:1px solid rgba(196,169,125,0.2);border-radius:8px;padding:28px 32px;max-width:440px;width:90%;transform:scale(0.9);transition:transform 0.3s}
.modal-overlay.open .modal{transform:scale(1)}
.modal h2{font-size:20px;color:#d4c5a9;margin-bottom:16px;font-weight:400;letter-spacing:2px}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#6a5535;font-size:24px;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#8b7355;margin-bottom:4px;letter-spacing:1px}
.form-group input{width:100%;padding:9px 12px;background:rgba(26,20,16,0.5);border:1px solid rgba(196,169,125,0.15);border-radius:4px;color:#d4c5a9;font-size:14px;outline:none}
.form-group input:focus{border-color:rgba(196,169,125,0.35)}
.form-row{display:flex;gap:12px}
.flex-1{flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{padding:9px 24px;border-radius:4px;font-size:14px;cursor:pointer;transition:all 0.3s;border:1px solid transparent;font-family:Georgia,serif}
.btn-cancel{background:transparent;border-color:rgba(196,169,125,0.15);color:#6a5535}
.btn-cancel:hover{color:#8b7355;border-color:rgba(196,169,125,0.3)}
.btn-submit{background:rgba(196,169,125,0.12);border-color:rgba(196,169,125,0.3);color:#c4a97d}
.btn-submit:hover{background:rgba(196,169,125,0.2);border-color:#c4a97d}
.btn-danger{background:rgba(180,80,60,0.15);border-color:rgba(180,80,60,0.3);color:#d48a6a}
.btn-danger:hover{background:rgba(180,80,60,0.25);border-color:#d48a6a}
.admin-overlay{position:fixed;inset:0;z-index:80;background:rgba(15,11,8,0.92);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:all 0.4s;backdrop-filter:blur(8px);overflow-y:auto}
.admin-overlay.open{opacity:1;visibility:visible}
.admin-header{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;border-bottom:1px solid rgba(196,169,125,0.1)}
.admin-header h2{font-size:22px;color:#e8d5b0;font-weight:400;letter-spacing:3px}
.admin-close{background:none;border:none;color:#8b7355;font-size:30px;cursor:pointer;transition:color 0.3s;line-height:1;padding:4px}
.admin-close:hover{color:#c4a97d}
.admin-body{padding:24px 32px;flex:1}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.admin-card{background:rgba(42,32,24,0.6);border:1px solid rgba(196,169,125,0.12);border-radius:6px;padding:16px;display:flex;gap:14px;align-items:flex-start;transition:border-color 0.3s}
.admin-card:hover{border-color:rgba(196,169,125,0.25)}
.admin-card-thumb{width:70px;height:70px;flex-shrink:0;border-radius:3px;overflow:hidden;background:#f5ede1;padding:2px 2px 5px}
.admin-card-thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(0.2)}
.admin-card-fields{flex:1;min-width:0}
.admin-card-fields input{width:100%;margin-bottom:5px;padding:5px 8px;background:rgba(26,20,16,0.5);border:1px solid rgba(196,169,125,0.15);border-radius:3px;color:#d4c5a9;font-size:13px;outline:none}
.admin-card-fields input:focus{border-color:rgba(196,169,125,0.35)}
.admin-card-actions{display:flex;gap:6px;flex-shrink:0;flex-direction:column;align-items:center}
.admin-card-actions button{background:none;border:1px solid rgba(196,169,125,0.15);color:#6a5535;width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:14px;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.admin-card-actions button:hover{color:#c4a97d;border-color:rgba(196,169,125,0.35)}
.admin-card-actions .del-btn:hover{color:#d48a6a;border-color:rgba(180,80,60,0.4)}
.admin-footer{position:sticky;bottom:0;background:rgba(15,11,8,0.95);border-top:1px solid rgba(196,169,125,0.1);padding:16px 32px;display:flex;justify-content:flex-end;gap:12px}
@media(max-width:768px){
.nav-btn{width:36px;height:60px;font-size:24px}
.upload-btn{bottom:70px;right:14px;width:44px;height:44px;font-size:20px}
.main-content{padding:0 12px 40px}.image-area{height:55vh;gap:4px}
.preview{width:50px;height:38px}.photo-title{font-size:18px}.photo-date{font-size:14px}
.timeline-section{padding:0 16px}.timeline-dot{width:6px;height:6px}
.year-label{font-size:48px}
.manage-btn{top:12px;right:12px;width:32px;height:32px;font-size:14px}
.pwd-box{padding:24px 20px 20px;max-width:300px}
.pwd-box h3{font-size:15px}.pwd-box input{padding:8px 12px;font-size:14px}
.modal-overlay .modal{padding:20px 16px;max-width:92%}
.admin-card{flex-wrap:wrap;gap:6px;padding:6px}
.admin-card-thumb{width:44px;height:44px}
.admin-card-actions{flex-direction:row;flex-wrap:wrap;gap:2px}
.admin-card-actions button{width:24px;height:24px;font-size:11px}
.preview-tb{bottom:16px;gap:6px}
.preview-tb button{width:36px;height:36px;font-size:13px}
.preview-tb button:last-child{width:auto;padding:0 10px;font-size:12px}
}

.preview-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .3s}
.preview-overlay.open{opacity:1;visibility:visible}
.preview-overlay img{max-width:90%;max-height:85%;object-fit:contain;transition:transform .3s}
.preview-close{position:fixed;top:20px;right:24px;z-index:201;background:none;border:none;color:#8b7355;font-size:32px;cursor:pointer}
.preview-close:hover{color:#c4a97d}
.preview-tb{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:201;display:flex;gap:10px}
.preview-tb button{background:rgba(26,20,16,0.6);border:1px solid rgba(196,169,125,0.2);color:#c4a97d;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .3s}
.preview-tb button:hover{background:rgba(196,169,125,0.1);border-color:#c4a97d}

/* Password Modal */
.pwd-overlay{position:fixed;inset:0;z-index:180;background:rgba(15,11,8,0.85);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .35s ease;backdrop-filter:blur(3px)}
.pwd-overlay.open{opacity:1;visibility:visible}
.pwd-box{background:linear-gradient(145deg,#2a2018,#1a1410);border:1px solid rgba(196,169,125,0.15);border-radius:8px;padding:32px 36px 28px;max-width:340px;width:88%;box-shadow:0 12px 40px rgba(0,0,0,0.5);transform:translateY(20px);transition:transform .35s ease;text-align:center}
.pwd-overlay.open .pwd-box{transform:translateY(0)}
.pwd-box h3{color:#c4a97d;font-size:17px;font-weight:400;letter-spacing:2px;margin-bottom:20px}
.pwd-box input{width:100%;padding:10px 14px;background:rgba(26,20,16,0.6);border:1px solid rgba(196,169,125,0.15);border-radius:4px;color:#d4c5a9;font-size:15px;outline:none;text-align:center;letter-spacing:4px;transition:border-color .3s;font-family:inherit}
.pwd-box input:focus{border-color:rgba(196,169,125,0.4)}
.pwd-box .pwd-err{color:#b06050;font-size:13px;min-height:20px;margin-top:8px;transition:opacity .3s}
.pwd-actions{display:flex;gap:10px;margin-top:18px;justify-content:center}
.pwd-actions button{min-width:80px;padding:8px 20px;border:1px solid rgba(196,169,125,0.2);border-radius:4px;font-size:14px;cursor:pointer;transition:all .3s;background:transparent;color:#a08970;font-family:inherit;letter-spacing:1px}
.pwd-actions button:hover{border-color:rgba(196,169,125,0.4);color:#c4a97d}
.pwd-actions .pwd-submit{background:rgba(196,169,125,0.1);color:#c4a97d}
.pwd-actions .pwd-submit:hover{background:rgba(196,169,125,0.18)}
.pwd-actions .pwd-cancel{color:#6a5535}
/* ===== Responsive - Tablet ===== */
@media(max-width:1024px){
.main-content{padding:0 40px 50px}
.image-area{height:55vh;max-width:100%}
.main-image{max-width:85%}
.photo-title{font-size:22px}
.timeline-section{padding:0 40px}
.admin-dialog{min-width:400px;max-width:600px}
}
/* ===== Responsive - Phone ===== */
@media(max-width:768px){
.main-content{padding:0 10px 70px}
.image-area{height:auto;flex-direction:column;gap:8px;max-height:52vh}
.main-image{max-width:100%;height:auto;max-height:44vh}
.main-image .photo-frame{height:auto}
.photo-frame{padding:5px 5px 16px}
.photo-frame img{max-height:40vh;width:auto;margin:0 auto}
.preview{display:none!important}
.info-section{margin-top:8px}
.photo-counter{font-size:11px}
.photo-title{font-size:17px}
.photo-date{font-size:14px}
.year-label{font-size:40px;top:-12px;letter-spacing:4px}
.timeline-section{padding:0 10px;bottom:8px}
.timeline-container{height:28px}
.timeline-dot{width:6px;height:6px}
.timeline-dot .dot-year{font-size:8px;bottom:10px}
.nav-btn{width:36px;height:36px;font-size:14px;line-height:36px}
.nav-prev{left:4px}
.nav-next{right:4px}
.admin-dialog{min-width:auto;width:94vw;max-width:94vw;max-height:85vh;border-radius:4px}
.admin-header{flex-direction:column;gap:6px;padding:12px 14px 0}
.admin-header h2{font-size:18px}
.admin-grid{gap:8px;padding:8px}
.admin-item{width:calc(50% - 8px)}
.admin-item img{height:80px}
.admin-item .ai-title{font-size:11px}
.admin-item .ai-date{font-size:10px}
.upload-dialog{width:88vw;padding:20px;border-radius:4px}
.upload-dialog h2{font-size:18px}
.upload-area{min-height:120px;padding:20px}
.upload-area p{font-size:13px}
.editor-dialog{width:96vw;max-width:600px;height:auto;min-height:80vh;flex-direction:column;border-radius:4px}
.editor-canvas-wrap{flex:none;width:100%!important;height:38vh}
.editor-controls{flex:none;width:100%!important;padding:10px;gap:4px}
.editor-controls h3{font-size:14px}
.editor-controls label{font-size:11px}
.editor-controls input[type="range"]{height:26px}
.editor-btns{flex-wrap:wrap;gap:6px}
.editor-btns button{flex:1;min-width:60px;font-size:12px;padding:6px 8px}
.compress-dialog{padding:16px;border-radius:4px}
.compress-dialog h3{font-size:16px}
.compress-progress-wrap{height:6px}
.admin-actions{flex-wrap:wrap;gap:6px;flex-direction:column;padding:0 14px 12px}
.admin-actions button{font-size:12px;padding:6px 12px}
.pwd-dialog{width:88vw;padding:24px;border-radius:4px}
}
/* ===== Responsive - Small Phone ===== */
@media(max-width:480px){
.main-content{padding:0 6px 60px}
.image-area{max-height:45vh}
.main-image{max-height:35vh}
.main-image .photo-frame{height:auto}
.photo-frame{padding:3px 3px 10px}
.photo-frame img{max-height:30vh}
.photo-title{font-size:14px}
.photo-date{font-size:12px}
.year-label{font-size:24px;letter-spacing:2px;top:-8px}
.nav-btn{width:28px;height:28px;font-size:11px;line-height:28px}
.nav-prev{left:2px}
.nav-next{right:2px}
.admin-item{width:100%}
.admin-item img{height:70px}
.admin-grid{gap:6px;padding:6px}
.editor-canvas-wrap{height:30vh}
.editor-controls{padding:8px;gap:3px}
.editor-btns button{font-size:11px;padding:5px 6px}
.timeline-dot{width:5px;height:5px}
.timeline-dot .dot-year{font-size:7px;bottom:8px}
}
</style>
</head>
<body>
<div id="app">
<div class="bg-layer" id="bgLayer"></div>
<div class="grain-overlay"></div>
<div class="scanlines"></div>
<div class="light-leak" id="lightLeak"></div>
<div class="shutter-flash" id="shutterFlash"></div>
<canvas id="particleCanvas"></canvas>
<div class="main-content">
<div class="image-area">
<div class="preview" id="prevPreview"><div class="preview-img-wrap"><img id="prevImg" alt=""></div></div>
<div class="main-image" id="mainImage">
<div class="photo-frame" id="photoFrame">
<img id="currentImg" alt="">
<div class="photo-vignette"></div>
</div>
</div>
<div class="preview" id="nextPreview"><div class="preview-img-wrap"><img id="nextImg" alt=""></div></div>
</div>
<div class="info-section">
<div class="photo-counter" id="counter">1 / 3</div>
<div class="photo-title" id="photoTitle">0503</div>
<div class="photo-date" id="photoDate">2025.05</div>
<div class="year-label" id="yearLabel">2 0 2 5</div>
</div>
</div>
<div class="timeline-section">
<div class="timeline-container">
<div class="timeline-line"></div>
<div class="timeline-dots" id="timelineDots"></div>
</div>
</div>
<button class="nav-btn nav-prev" id="navPrev">&#8249;</button>
<button class="nav-btn nav-next" id="navNext">&#8250;</button>
<button class="upload-btn" id="uploadBtn" title="上传回忆">+</button>
<button class="manage-btn" id="manageBtn" title="管理回忆">&#9881;</button>
<input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<div class="compressing" id="compressingOverlay">
<div class="spinner"></div>
<p>正在压缩图片...</p>
</div>

<div class="modal-overlay" id="adminPanel">
<div class="admin-header">
<h2>&#9881; 管理回忆录</h2>
<button class="admin-close" id="adminClose">&times;</button>
</div>
<div class="admin-body">
<div class="admin-grid" id="adminGrid"></div>
<div class="admin-footer" style="position:static;padding:16px 0 0;border:none">
<button class="btn btn-cancel" id="adminCancelBtn">关闭</button>
<button class="btn btn-submit" id="adminSaveBtn">保存更改</button>
</div>
</div>
</div>

<div class="modal-overlay" id="uploadModal">
<div class="modal" style="position:relative">
<button class="modal-close" id="modalClose">&times;</button>
<h2>添加新的回忆</h2>
<div class="form-group">

// ===== Compress Image =====
function compressImage(file, cb){
  var MAX_DIM = 1920;
  var QUALITY = 0.85;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      var w = img.width, h = img.height;
      if(w>MAX_DIM||h>MAX_DIM){
        var r = Math.min(MAX_DIM/w, MAX_DIM/h);
        w*=r; h*=r;
      }
      canvas.width = Math.round(w);
      canvas.height = Math.round(h);
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      (function tryQ(q){
        canvas.toBlob(function(blob){
          if(!blob){ cb("Compression failed"); return; }
          var mb = blob.size/(1024*1024);
          if(mb>2.0&&q>0.4){ tryQ(q-0.1); }
          else {
            var nf = new File([blob], file.name.replace(/\..+$/,".jpg"), {type:"image/jpeg"});
            cb(null, nf, Math.round(mb*10)/10);
          }
        }, "image/jpeg", q);
      })(QUALITY);
    };
    img.src = e.target.result;
  };
  reader.onerror = function(){ cb("Read failed"); };
  reader.readAsDataURL(file);
}

// ===== Upload =====
function uploadToSupabase(file, cb){
  var ext = "jpg";
  var fn = Date.now()+"_"+Math.random().toString(36).slice(2,8)+"."+ext;
  var xhr = new XMLHttpRequest();
  xhr.open("POST", STORAGE_URL+"/object/"+BUCKET_NAME+"/"+fn, true);
  xhr.setRequestHeader("Authorization","Bearer "+SUPABASE_KEY);
  xhr.setRequestHeader("Content-Type","image/jpeg");
  xhr.setRequestHeader("x-upsert","true");
  xhr.onload = function(){
    if(xhr.status>=200&&xhr.status<300) cb(null, STORAGE_URL+"/object/public/"+BUCKET_NAME+"/"+fn);
    else cb("Upload failed: "+xhr.status+" "+xhr.responseText);
  };
  xhr.onerror = function(){ cb("Network error"); };
  xhr.send(file);
}

function removeFromSupabase(m){
  if(!m||!m.url) return;
  var p="/object/public/"+BUCKET_NAME+"/", i=m.url.indexOf(p);
  if(i<0) return;
  var fn=m.url.substring(i+p.length).split("?")[0];
  if(!fn) return;
  var xhr=new XMLHttpRequest();
  xhr.open("DELETE",STORAGE_URL+"/object/"+BUCKET_NAME+"/"+fn,true);
  xhr.setRequestHeader("Authorization","Bearer "+SUPABASE_KEY);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.onload=function(){
    if(xhr.status>=200&&xhr.status<300){
      try{console.log("cloud deleted: "+fn);}catch(e){}
    }else{
      try{alert("记录已删除，但云端图片删除失败("+xhr.status+")，请到 Supabase 控制台手动清理: "+fn);}catch(e){}
    }
  };
  xhr.onerror=function(){
    try{alert("网络异常，云端图片未能自动删除，请到 Supabase 控制台手动清理: "+fn);}catch(e){}
  };
  xhr.send(JSON.stringify([fn]));
}

    updateDisplay();
  });
  removeFromSupabase(removed);
  closeConfirm();deleteTarget=null;
});

function he(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ===== Effects =====
function randomEffect(){var fx=[lightLeak,bokehEffect,sparkleEffect,shutterFlash];fx[Math.floor(Math.random()*fx.length)]();}
function lightLeak(){
  var lk=el.lightLeak; var h=15+Math.random()*40,x=10+Math.random()*80,y=20+Math.random()*60;
  lk.style.background="radial-gradient(ellipse at "+x+"% "+y+"%, hsla("+h+",30%,60%,0.3) 0%,transparent 40%)";
  lk.classList.add("active");setTimeout(function(){lk.classList.remove("active");},180);
}
function bokehEffect(){
  for(var i=0;i<6;i++){
    var c=document.createElement("div");
    c.style.cssText="position:fixed;z-index:49;pointer-events:none;border-radius:50%;opacity:0;animation:bokehFade "+(0.6+Math.random()*0.8)+"s ease-out forwards;background:radial-gradient(circle at 30% 30%,hsla("+(30+Math.random()*30)+",40%,70%,0.2),transparent)";
    var sz=20+Math.random()*80;c.style.width=sz+"px";c.style.height=sz+"px";
    c.style.left=(Math.random()*100)+"%";c.style.top=(Math.random()*100)+"%";
    document.body.appendChild(c);
    setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},2000);
  }
}
function sparkleEffect(){
  for(var i=0;i<8;i++){
    var s=document.createElement("div");
    s.style.cssText="position:fixed;z-index:49;pointer-events:none;border-radius:50%;opacity:0;animation:sparkleFade "+(0.5+Math.random()*0.6)+"s ease-out forwards";
    var sz=2+Math.random()*4;s.style.width=sz+"px";s.style.height=sz+"px";
    s.style.left=(Math.random()*100)+"%";s.style.top=(Math.random()*100)+"%";
    s.style.background="hsla("+(35+Math.random()*20)+",60%,80%,0.5)";
    document.body.appendChild(s);
    setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1500);
  }
}
function shutterFlash(){
  var sf=el.shutterFlash;sf.style.background="rgba(255,255,255,0.03)";sf.style.opacity="1";
  setTimeout(function(){sf.style.opacity="0";},50);
}

// ===== Particles =====
function startParticles(){
  var c=el.particleCanvas;if(!c)return;
  c.width=window.innerWidth;c.height=window.innerHeight;
  var cx=c.getContext("2d");ps=[];
  for(var i=0;i<30;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,sz:Math.random()*2+0.5,sx:(Math.random()-0.5)*0.12,sy:-(Math.random()*0.08+0.02),op:Math.random()*0.2+0.03,hu:30+Math.random()*20});
  (function an(){cx.clearRect(0,0,c.width,c.height);
    ps.forEach(function(p){p.x+=p.sx;p.y+=p.sy;if(p.y<-10){p.y=c.height+10;p.x=Math.random()*c.width;}if(p.x<-10)p.x=c.width+10;if(p.x>c.width+10)p.x=-10;
    cx.beginPath();cx.arc(p.x,p.y,p.sz,0,Math.PI*2);cx.fillStyle="hsla("+p.hu+",40%,70%,"+p.op+")";cx.fill();
    cx.beginPath();cx.arc(p.x,p.y,p.sz*3,0,Math.PI*2);cx.fillStyle="hsla("+p.hu+",40%,70%,"+(p.op*0.1)+")";cx.fill();});
    requestAnimationFrame(an);})();
}

// ===== Events =====
function bindEvents(){
  document.addEventListener("wheel",function(e){e.preventDefault();if(e.deltaY>0)nextImg();else prevImg();},{passive:false});
  document.addEventListener("keydown",function(e){
    if(el.uploadModal.classList.contains("open")||el.adminPanel.classList.contains("open")||el.confirmDialog.classList.contains("open"))return;
    if(e.key==="ArrowLeft"||e.key==="ArrowUp")prevImg();else if(e.key==="ArrowRight"||e.key==="ArrowDown")nextImg();});
  el.navPrev.addEventListener("click",prevImg);el.navNext.addEventListener("click",nextImg);
  window.addEventListener("resize",function(){var c=el.particleCanvas;if(c){c.width=window.innerWidth;c.height=window.innerHeight;}});
  // Touch swipe for mobile
  var tx=0,ty=0;
  document.addEventListener("touchstart",function(e){
    if(el.uploadModal.classList.contains("open")||el.adminPanel.classList.contains("open")||el.confirmDialog.classList.contains("open")||el.editorOverlay.classList.contains("open")||el.compressOverlay.classList.contains("open")){tx=0;return}
    tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(tx===0)return;
    var dx=tx-e.changedTouches[0].screenX,dy=ty-e.changedTouches[0].screenY;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){if(dx>0)nextImg();else prevImg()}
    tx=0;
  },{passive:true});
}

var as=document.createElement("style");
as.textContent="@keyframes bokehFade{0%{opacity:0;transform:scale(0.3)}30%{opacity:0.6}100%{opacity:0;transform:scale(2.5)}}@keyframes sparkleFade{0%{opacity:0;transform:scale(0)}30%{opacity:0.8;transform:scale(1.2)}100%{opacity:0;transform:scale(0)}}";
document.head.appendChild(as);

document.addEventListener("DOMContentLoaded",init);
})();
</script>
