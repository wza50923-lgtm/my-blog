<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>时光回忆录</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1410}
body{font-family:Georgia,serif;color:#d4c5a9}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a2018 0%,#1a1410 50%,#0f0b08 100%)}
.bg-layer{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 20%,rgba(180,140,100,0.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(200,160,120,0.04) 0%,transparent 50%),repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(210,180,140,0.015) 2px,rgba(210,180,140,0.015) 4px);transition:transform 1.5s;z-index:0}
.grain-overlay{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px;animation:grainShift 0.3s steps(4) infinite}
@keyframes grainShift{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}}
.scanlines{position:fixed;inset:0;z-index:89;pointer-events:none;opacity:0.02;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.2) 1px,rgba(0,0,0,0.2) 2px)}
#particleCanvas{position:fixed;inset:0;z-index:1;pointer-events:none}
.main-content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 80px 60px}
.image-area{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;max-width:1000px;height:62vh}
.main-image{flex:0 0 auto;height:100%;max-width:78%;position:relative;z-index:5}
.photo-frame{position:relative;height:100%;padding:10px 10px 28px 10px;background:#f5ede1;box-shadow:0 4px 30px rgba(0,0,0,0.5);border-radius:1px;overflow:hidden;transition:transform 0.5s,opacity 0.5s,filter 0.5s}
.photo-frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:1px;position:relative;z-index:1;filter:sepia(0.15)saturate(0.85)contrast(1.05)}
.photo-vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.5) 100%);mix-blend-mode:multiply}.photo-frame::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 1px 2px rgba(0,0,0,0.06);border-radius:1px}
.preview{flex:0 0 auto;width:100px;height:70px;opacity:0.25;transition:all 0.5s;position:relative;z-index:1}
.preview-img-wrap{width:100%;height:100%;padding:3px 3px 8px;background:#f5ede1;box-shadow:0 2px 12px rgba(0,0,0,0.3);border-radius:1px;overflow:hidden}
.preview-img-wrap img{width:100%;height:100%;object-fit:cover;filter:sepia(0.3)saturate(0.7)blur(1px);opacity:0.5}
.info-section{text-align:center;margin-top:16px;position:relative;width:100%;max-width:600px}
.photo-counter{font-size:13px;color:#8b7355;letter-spacing:1px;margin-bottom:4px}
.photo-title{font-size:26px;font-style:italic;color:#e8d5b0;letter-spacing:1px;min-height:1.4em}
.photo-date{font-size:17px;color:#a08970}
.year-label{font-size:72px;font-weight:700;color:rgba(180,150,110,0.06);position:absolute;left:50%;transform:translateX(-50%);top:-20px;white-space:nowrap;letter-spacing:8px;pointer-events:none}
.timeline-section{position:fixed;bottom:14px;left:0;right:0;z-index:30;padding:0 60px}
.timeline-container{position:relative;width:100%;height:36px;display:flex;align-items:center}
.timeline-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(196,169,125,0.2) 10%,rgba(196,169,125,0.2) 90%,transparent);top:50%}
.timeline-dots{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 4%}
.timeline-dot{width:8px;height:8px;border-radius:50%;background:rgba(196,169,125,0.2);border:1px solid rgba(196,169,125,0.15);cursor:pointer;transition:all 0.4s;position:relative;flex-shrink:0}
.timeline-dot:hover{background:rgba(196,169,125,0.4);transform:scale(1.4)}
.timeline-dot.active{background:#c4a97d;border-color:#c4a97d;transform:scale(1.5);box-shadow:0 0 12px rgba(196,169,125,0.3)}
.timeline-dot .dot-year{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(196,169,125,0.35);white-space:nowrap;pointer-events:none}
.timeline-dot.active .dot-year{color:rgba(196,169,125,0.7)}
.nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:25;background:rgba(26,20,16,0.5);border:1px solid rgba(196,169,125,0.2);color:rgba(196,169,125,0.5);width:44px;height:80px;cursor:pointer;font-size:32px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;user-select:none}
.nav-btn:hover{background:rgba(196,169,125,0.1);border-color:rgba(196,169,125,0.4);color:#c4a97d}
.nav-prev{left:0;border-radius:0 5px 5px 0}
.nav-next{right:0;border-radius:5px 0 0 5px}
.upload-btn{position:fixed;bottom:85px;right:25px;z-index:40;width:48px;height:48px;border-radius:50%;border:2px solid rgba(196,169,125,0.35);background:rgba(26,20,16,0.85);color:#c4a97d;font-size:24px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;line-height:1}
.upload-btn:hover{background:rgba(196,169,125,0.12);border-color:#c4a97d;transform:scale(1.1);box-shadow:0 0 18px rgba(196,169,125,0.15)}
.manage-btn{position:fixed;top:16px;right:16px;z-index:40;width:36px;height:36px;border-radius:50%;border:1px solid rgba(196,169,125,0.2);background:rgba(26,20,16,0.6);color:#8b7355;font-size:16px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.manage-btn:hover{color:#c4a97d;border-color:rgba(196,169,125,0.4)}
.light-leak{position:fixed;inset:0;z-index:46;pointer-events:none;opacity:0;transition:opacity 0.08s}
.light-leak.active{opacity:1;transition:opacity 0.04s}
.shutter-flash{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0;transition:opacity 0.05s}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all 0.35s;backdrop-filter:blur(4px)}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:#2a2018;border:1px solid rgba(196,169,125,0.2);border-radius:8px;padding:28px 32px;max-width:440px;width:90%;transform:scale(0.9);transition:transform 0.3s}
.modal-overlay.open .modal{transform:scale(1)}
.modal h2{font-size:20px;color:#d4c5a9;margin-bottom:16px;font-weight:400;letter-spacing:2px}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#6a5535;font-size:24px;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#8b7355;margin-bottom:4px;letter-spacing:1px}
.form-group input{width:100%;padding:9px 12px;background:rgba(26,20,16,0.5);border:1px solid rgba(196,169,125,0.15);border-radius:4px;color:#d4c5a9;font-size:14px;outline:none}
.form-group input:focus{border-color:rgba(196,169,125,0.35)}
.form-row{display:flex;gap:12px}
.flex-1{flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{padding:9px 24px;border-radius:4px;font-size:14px;cursor:pointer;transition:all 0.3s;border:1px solid transparent;font-family:Georgia,serif}
.btn-cancel{background:transparent;border-color:rgba(196,169,125,0.15);color:#6a5535}
.btn-cancel:hover{color:#8b7355;border-color:rgba(196,169,125,0.3)}
.btn-submit{background:rgba(196,169,125,0.12);border-color:rgba(196,169,125,0.3);color:#c4a97d}
.btn-submit:hover{background:rgba(196,169,125,0.2);border-color:#c4a97d}
.btn-danger{background:rgba(180,80,60,0.15);border-color:rgba(180,80,60,0.3);color:#d48a6a}
.btn-danger:hover{background:rgba(180,80,60,0.25);border-color:#d48a6a}
.admin-overlay{position:fixed;inset:0;z-index:80;background:rgba(15,11,8,0.92);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:all 0.4s;backdrop-filter:blur(8px);overflow-y:auto}
.admin-overlay.open{opacity:1;visibility:visible}
.admin-header{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;border-bottom:1px solid rgba(196,169,125,0.1)}
.admin-header h2{font-size:22px;color:#e8d5b0;font-weight:400;letter-spacing:3px}
.admin-close{background:none;border:none;color:#8b7355;font-size:30px;cursor:pointer;transition:color 0.3s;line-height:1;padding:4px}
.admin-close:hover{color:#c4a97d}
.admin-body{padding:24px 32px;flex:1}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.admin-card{background:rgba(42,32,24,0.6);border:1px solid rgba(196,169,125,0.12);border-radius:6px;padding:16px;display:flex;gap:14px;align-items:flex-start;transition:border-color 0.3s}
.admin-card:hover{border-color:rgba(196,169,125,0.25)}
.admin-card-thumb{width:70px;height:70px;flex-shrink:0;border-radius:3px;overflow:hidden;background:#f5ede1;padding:2px 2px 5px}
.admin-card-thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(0.2)}
.admin-card-fields{flex:1;min-width:0}
.admin-card-fields input{width:100%;margin-bottom:5px;padding:5px 8px;background:rgba(26,20,16,0.5);border:1px solid rgba(196,169,125,0.15);border-radius:3px;color:#d4c5a9;font-size:13px;outline:none}
.admin-card-fields input:focus{border-color:rgba(196,169,125,0.35)}
.admin-card-actions{display:flex;gap:6px;flex-shrink:0;flex-direction:column;align-items:center}
.admin-card-actions button{background:none;border:1px solid rgba(196,169,125,0.15);color:#6a5535;width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:14px;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.admin-card-actions button:hover{color:#c4a97d;border-color:rgba(196,169,125,0.35)}
.admin-card-actions .del-btn:hover{color:#d48a6a;border-color:rgba(180,80,60,0.4)}
.admin-footer{position:sticky;bottom:0;background:rgba(15,11,8,0.95);border-top:1px solid rgba(196,169,125,0.1);padding:16px 32px;display:flex;justify-content:flex-end;gap:12px}
@media(max-width:768px){
.nav-btn{width:36px;height:60px;font-size:24px}
.upload-btn{bottom:70px;right:14px;width:44px;height:44px;font-size:20px}
.main-content{padding:0 12px 40px}.image-area{height:55vh;gap:4px}
.preview{width:50px;height:38px}.photo-title{font-size:18px}.photo-date{font-size:14px}
.timeline-section{padding:0 16px}.timeline-dot{width:6px;height:6px}
.year-label{font-size:48px}
.manage-btn{top:12px;right:12px;width:32px;height:32px;font-size:14px}
.pwd-box{padding:24px 20px 20px;max-width:300px}
.pwd-box h3{font-size:15px}.pwd-box input{padding:8px 12px;font-size:14px}
.modal-overlay .modal{padding:20px 16px;max-width:92%}
.admin-card{flex-wrap:wrap;gap:6px;padding:6px}
.admin-card-thumb{width:44px;height:44px}
.admin-card-actions{flex-direction:row;flex-wrap:wrap;gap:2px}
.admin-card-actions button{width:24px;height:24px;font-size:11px}
.preview-tb{bottom:16px;gap:6px}
.preview-tb button{width:36px;height:36px;font-size:13px}
.preview-tb button:last-child{width:auto;padding:0 10px;font-size:12px}
}

.preview-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .3s}
.preview-overlay.open{opacity:1;visibility:visible}
.preview-overlay img{max-width:90%;max-height:85%;object-fit:contain;transition:transform .3s}
.preview-close{position:fixed;top:20px;right:24px;z-index:201;background:none;border:none;color:#8b7355;font-size:32px;cursor:pointer}
.preview-close:hover{color:#c4a97d}
.preview-tb{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:201;display:flex;gap:10px}
.preview-tb button{background:rgba(26,20,16,0.6);border:1px solid rgba(196,169,125,0.2);color:#c4a97d;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .3s}
.preview-tb button:hover{background:rgba(196,169,125,0.1);border-color:#c4a97d}

/* Password Modal */
.pwd-overlay{position:fixed;inset:0;z-index:180;background:rgba(15,11,8,0.85);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .35s ease;backdrop-filter:blur(3px)}
.pwd-overlay.open{opacity:1;visibility:visible}
.pwd-box{background:linear-gradient(145deg,#2a2018,#1a1410);border:1px solid rgba(196,169,125,0.15);border-radius:8px;padding:32px 36px 28px;max-width:340px;width:88%;box-shadow:0 12px 40px rgba(0,0,0,0.5);transform:translateY(20px);transition:transform .35s ease;text-align:center}
.pwd-overlay.open .pwd-box{transform:translateY(0)}
.pwd-box h3{color:#c4a97d;font-size:17px;font-weight:400;letter-spacing:2px;margin-bottom:20px}
.pwd-box input{width:100%;padding:10px 14px;background:rgba(26,20,16,0.6);border:1px solid rgba(196,169,125,0.15);border-radius:4px;color:#d4c5a9;font-size:15px;outline:none;text-align:center;letter-spacing:4px;transition:border-color .3s;font-family:inherit}
.pwd-box input:focus{border-color:rgba(196,169,125,0.4)}
.pwd-box .pwd-err{color:#b06050;font-size:13px;min-height:20px;margin-top:8px;transition:opacity .3s}
.pwd-actions{display:flex;gap:10px;margin-top:18px;justify-content:center}
.pwd-actions button{min-width:80px;padding:8px 20px;border:1px solid rgba(196,169,125,0.2);border-radius:4px;font-size:14px;cursor:pointer;transition:all .3s;background:transparent;color:#a08970;font-family:inherit;letter-spacing:1px}
.pwd-actions button:hover{border-color:rgba(196,169,125,0.4);color:#c4a97d}
.pwd-actions .pwd-submit{background:rgba(196,169,125,0.1);color:#c4a97d}
.pwd-actions .pwd-submit:hover{background:rgba(196,169,125,0.18)}
.pwd-actions .pwd-cancel{color:#6a5535}
/* ===== Responsive - Tablet ===== */
@media(max-width:1024px){
.main-content{padding:0 40px 50px}
.image-area{height:55vh;max-width:100%}
.main-image{max-width:85%}
.photo-title{font-size:22px}
.timeline-section{padding:0 40px}
.admin-dialog{min-width:400px;max-width:600px}
}
/* ===== Responsive - Phone ===== */
@media(max-width:768px){
.main-content{padding:0 10px 70px}
.image-area{height:auto;flex-direction:column;gap:8px;max-height:52vh}
.main-image{max-width:100%;height:auto;max-height:44vh}
.main-image .photo-frame{height:auto}
.photo-frame{padding:5px 5px 16px}
.photo-frame img{max-height:40vh;width:auto;margin:0 auto}
.preview{display:none!important}
.info-section{margin-top:8px}
.photo-counter{font-size:11px}
.photo-title{font-size:17px}
.photo-date{font-size:14px}
.year-label{font-size:40px;top:-12px;letter-spacing:4px}
.timeline-section{padding:0 10px;bottom:8px}
.timeline-container{height:28px}
.timeline-dot{width:6px;height:6px}
.timeline-dot .dot-year{font-size:8px;bottom:10px}
.nav-btn{width:36px;height:36px;font-size:14px;line-height:36px}
.nav-prev{left:4px}
.nav-next{right:4px}
.admin-dialog{min-width:auto;width:94vw;max-width:94vw;max-height:85vh;border-radius:4px}
.admin-header{flex-direction:column;gap:6px;padding:12px 14px 0}
.admin-header h2{font-size:18px}
.admin-grid{gap:8px;padding:8px}
.admin-item{width:calc(50% - 8px)}
.admin-item img{height:80px}
.admin-item .ai-title{font-size:11px}
.admin-item .ai-date{font-size:10px}
.upload-dialog{width:88vw;padding:20px;border-radius:4px}
.upload-dialog h2{font-size:18px}
.upload-area{min-height:120px;padding:20px}
.upload-area p{font-size:13px}
.editor-dialog{width:96vw;max-width:600px;height:auto;min-height:80vh;flex-direction:column;border-radius:4px}
.editor-canvas-wrap{flex:none;width:100%!important;height:38vh}
.editor-controls{flex:none;width:100%!important;padding:10px;gap:4px}
.editor-controls h3{font-size:14px}
.editor-controls label{font-size:11px}
.editor-controls input[type="range"]{height:26px}
.editor-btns{flex-wrap:wrap;gap:6px}
.editor-btns button{flex:1;min-width:60px;font-size:12px;padding:6px 8px}
.compress-dialog{padding:16px;border-radius:4px}
.compress-dialog h3{font-size:16px}
.compress-progress-wrap{height:6px}
.admin-actions{flex-wrap:wrap;gap:6px;flex-direction:column;padding:0 14px 12px}
.admin-actions button{font-size:12px;padding:6px 12px}
.pwd-dialog{width:88vw;padding:24px;border-radius:4px}
}
/* ===== Responsive - Small Phone ===== */
@media(max-width:480px){
.main-content{padding:0 6px 60px}
.image-area{max-height:45vh}
.main-image{max-height:35vh}
.main-image .photo-frame{height:auto}
.photo-frame{padding:3px 3px 10px}
.photo-frame img{max-height:30vh}
.photo-title{font-size:14px}
.photo-date{font-size:12px}
.year-label{font-size:24px;letter-spacing:2px;top:-8px}
.nav-btn{width:28px;height:28px;font-size:11px;line-height:28px}
.nav-prev{left:2px}
.nav-next{right:2px}
.admin-item{width:100%}
.admin-item img{height:70px}
.admin-grid{gap:6px;padding:6px}
.editor-canvas-wrap{height:30vh}
.editor-controls{padding:8px;gap:3px}
.editor-btns button{font-size:11px;padding:5px 6px}
.timeline-dot{width:5px;height:5px}
.timeline-dot .dot-year{font-size:7px;bottom:8px}
}
/* ===== 相册分类侧边栏 ===== */
#catSidebar{position:fixed;left:0;top:0;bottom:0;width:150px;z-index:40;background:linear-gradient(180deg,rgba(26,20,16,0.95),rgba(18,13,10,0.98));border-right:1px solid rgba(196,169,125,0.14);display:flex;flex-direction:column;padding:24px 0 18px;overflow-y:auto;transform:translateX(-104%);transition:transform .28s ease;pointer-events:none}
#catSidebar.open{transform:translateX(0);pointer-events:auto}
.cat-header{font-size:12px;letter-spacing:4px;color:#a08970;text-align:center;padding:0 10px 14px;border-bottom:1px solid rgba(196,169,125,0.12);margin-bottom:12px;font-family:Georgia,serif}
.cat-item{position:relative;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin:1px 10px;color:#8b7355;font-size:14px;letter-spacing:2px;cursor:pointer;border:1px solid transparent;border-radius:3px;transition:all .3s;font-family:Georgia,serif;user-select:none}
.cat-item:hover{color:#d4c5a9;background:rgba(196,169,125,0.06)}
.cat-item.active{color:#e8d5b0;background:rgba(196,169,125,0.12);border-color:rgba(196,169,125,0.25)}
.cat-item.active::before{content:"";position:absolute;left:-10px;top:18%;bottom:18%;width:2px;background:#c4a97d}
.cat-count{font-size:11px;color:#6a5535;background:rgba(196,169,125,0.08);border-radius:8px;padding:1px 7px;letter-spacing:0}
.cat-item.active .cat-count{color:#c4a97d;background:rgba(196,169,125,0.18)}
.cat-side-foot{margin-top:auto;text-align:center;font-size:10px;color:#5a4832;letter-spacing:3px;padding-top:12px}

/* 平板适配 */
@media(max-width:1024px){
#catSidebar{width:110px}
.cat-item{padding:9px 10px;font-size:13px;margin:1px 6px}
.cat-item.active::before{left:-6px}
.cat-toggle{display:block}
}
/* 手机适配：侧边栏收为顶部横排分类条 */
@media(max-width:768px){
#catSidebar{width:72%;max-width:250px;box-shadow:4px 0 24px rgba(0,0,0,0.5);padding:16px 0 12px}
.cat-header{display:block}
#catList{display:block}
.cat-item{padding:9px 12px;font-size:13px;margin:1px 8px;border-radius:3px}

// ===== Compress Image =====
function compressImage(file, cb){
  var MAX_DIM = 1920;
  var QUALITY = 0.85;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      var w = img.width, h = img.height;
      if(w>MAX_DIM||h>MAX_DIM){
        var r = Math.min(MAX_DIM/w, MAX_DIM/h);
        w*=r; h*=r;
      }
      canvas.width = Math.round(w);
      canvas.height = Math.round(h);
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      (function tryQ(q){
        canvas.toBlob(function(blob){
          if(!blob){ cb("Compression failed"); return; }
          var mb = blob.size/(1024*1024);
          if(mb>2.0&&q>0.4){ tryQ(q-0.1); }
          else {
            var nf = new File([blob], file.name.replace(/\..+$/,".jpg"), {type:"image/jpeg"});
            cb(null, nf, Math.round(mb*10)/10);
          }
        }, "image/jpeg", q);
      })(QUALITY);
    };
    img.src = e.target.result;
  };
  reader.onerror = function(){ cb("Read failed"); };
  reader.readAsDataURL(file);
}

  var ext = "jpg";
  var fn = Date.now()+"_"+Math.random().toString(36).slice(2,8)+"."+ext;
  var xhr = new XMLHttpRequest();
  xhr.open("POST", STORAGE_URL+"/object/"+BUCKET_NAME+"/"+fn, true);
  // 【安全加固】用登录 token 替代公开的 anon key 发送上传请求
  xhr.setRequestHeader("Authorization","Bearer "+AUTH_TOKEN);
  xhr.setRequestHeader("Content-Type","image/jpeg");
  xhr.setRequestHeader("x-upsert","true");
  xhr.onload = function(){
    if(xhr.status>=200&&xhr.status<300) cb(null, STORAGE_URL+"/object/public/"+BUCKET_NAME+"/"+fn);

  xhr.onerror = function(){ cb("Network error"); };

}

function catTotal(c){
  var n=ms.filter(function(m){return (m.cat||"未分类")===c;}).length;
  getChildCats(c).forEach(function(sc){ n+=ms.filter(function(m){return m.cat===sc;}).length; });
  return n;
}
function parentSeq(){
  var seq=[];
  catList.forEach(function(c){ if(c!=="全部"&&c!=="未分类"&&!isChildCat(c)) seq.push(c); });
  return seq;
}
function buildCats(){
  var set={};set["全部"]=true;
  ms.forEach(function(m){set[m.cat||"未分类"]=true;});
  catOrder.forEach(function(c){set[c]=true;});
  Object.keys(catChildren).forEach(function(p){ set[p]=true; getChildCats(p).forEach(function(sc){set[sc]=true;}); });
  catList=["全部"];
  function pushParent(p){
    if(set[p]&&catList.indexOf(p)<0){
      catList.push(p);
      if(expandedCats[p]){ getChildCats(p).forEach(function(sc){ if(catList.indexOf(sc)<0) catList.push(sc); }); }
    }
  }
  catOrder.forEach(pushParent);
  Object.keys(catChildren).forEach(pushParent);
  Object.keys(set).forEach(function(c){
    if(c!=="全部"&&!isChildCat(c)&&catList.indexOf(c)<0) catList.push(c);
  });
  renderCatSidebar();
}
function renderCatSidebar(){
  var html="";
  catList.forEach(function(c){
    if(c==="全部")return;
    var isChild=isChildCat(c);
    var n=isChild? ms.filter(function(m){return m.cat===c;}).length : catTotal(c);
    var arrow="";
    if(!isChild&&catChildren[c]){
      arrow='<span class="cat-arrow'+(expandedCats[c]?" open":"")+'" data-toggle="'+he(c)+'">'+(expandedCats[c]?"&#9662;":"&#9656;")+'</span>';
    }
    var left='<span class="cat-left">'+arrow+'<span class="cat-name">'+he(c)+'</span></span>';
    html+='<div class="cat-item'+(curCat===c?" active":"")+(catBold.indexOf(c)>=0?" bold":"")+(isChild?" cat-child":"")+'" data-cat="'+he(c)+'">'+left+'<span class="cat-count">'+n+'</span></div>';
  });
  el.catList.innerHTML=html;
  Array.prototype.forEach.call(el.catList.querySelectorAll(".cat-item"),function(it){
    it.addEventListener("click",function(e){
      if(e.target.closest(".cat-arrow"))return;
      switchCat(this.dataset.cat);closeCatDrawer();
    });
  });
  Array.prototype.forEach.call(el.catList.querySelectorAll(".cat-arrow"),function(a){
    a.addEventListener("click",function(e){
      e.stopPropagation();
      var p=this.dataset.toggle;
      if(expandedCats[p])delete expandedCats[p];else expandedCats[p]=true;
      buildCats();
    });
  });
}
function viewMs(){
  if(curCat==="全部") return ms;
  if(catChildren[curCat]){
    return ms.filter(function(m){return (m.cat||"未分类")===curCat||getChildCats(curCat).indexOf(m.cat)>=0;});
  }
  return ms.filter(function(m){return (m.cat||"未分类")===curCat;});
}
function switchCat(c){
  if(c===curCat) return;
  curCat=c;
  ci=0;
  renderCatSidebar();
  renderTimeline();
  updateDisplay();
}
function openCatDrawer(){
  el.catSidebar.classList.add("open");
  el.catMask.classList.add("show");
}
function closeCatDrawer(){
  el.catSidebar.classList.remove("open");
  el.catMask.classList.remove("show");
}
function toggleCatDrawer(){
  if(el.catSidebar.classList.contains("open")) closeCatDrawer();
  else openCatDrawer();
}
function renderCatManage(){
  var html="";
  catList.forEach(function(c){
    if(c==="全部")return;
    var isChild=isChildCat(c);
    var n=isChild? ms.filter(function(m){return m.cat===c;}).length : catTotal(c);
    var foldBtn=(!isChild&&catChildren[c])?'<button class="cm-fold">'+(expandedCats[c]?"&#9662;":"&#9656;")+'</button>':'';
    var subBtn=(!isChild&&c!=="未分类")?'<button class="cm-sub">+子</button>':'';
    var sortBtns=(c==="未分类")?'<button class="cm-up" disabled style="opacity:.3">&#8593;</button><button class="cm-down" disabled style="opacity:.3">&#8595;</button>':'<button class="cm-up">&#8593;</button><button class="cm-down">&#8595;</button>';
    var boldChk='<label class="cm-bold-label"><input type="checkbox" class="cm-bold"'+(catBold.indexOf(c)>=0?" checked":"")+'>加粗</label>';
    html+='<div class="cat-manage-row'+(isChild?" cm-child":"")+'" data-cat="'+he(c)+'">'+
      foldBtn+
      '<input class="cm-name" value="'+he(c)+'">'+
      boldChk+
      '<span class="cm-count">'+n+' 张</span>'+
      '<div class="cm-btns">'+
      sortBtns+
      subBtn+
      '<button class="cm-rename">重命名</button>'+
      (c==="未分类"?'<button class="cm-del" style="opacity:.4" disabled>删除</button>':'<button class="cm-del">删除</button>')+
      '</div>'+
      '</div>';
  });
  el.catManageList.innerHTML=html;
  el.catManageList.querySelectorAll(".cm-bold").forEach(function(b){
    b.addEventListener("change",function(){
      var c=b.closest(".cat-manage-row").dataset.cat;
      var bi=catBold.indexOf(c);
      if(b.checked){ if(bi<0) catBold.push(c); }
      else { if(bi>=0) catBold.splice(bi,1); }
      buildCats();
    });
  });
  el.catManageList.querySelectorAll(".cm-fold").forEach(function(b){
    b.addEventListener("click",function(){
      var p=b.closest(".cat-manage-row").dataset.cat;
      if(expandedCats[p])delete expandedCats[p];else expandedCats[p]=true;
      renderCatManage();buildCats();
    });
  });
  el.catManageList.querySelectorAll(".cm-sub").forEach(function(b){
    b.addEventListener("click",function(){
      var p=b.closest(".cat-manage-row").dataset.cat;
      var nm=prompt("在「"+p+"」下创建子分类，输入名称：","");
      if(!nm||!nm.trim())return;
      nm=nm.trim();
      if(catList.indexOf(nm)>=0||isChildCat(nm)){alert("分类「"+nm+"」已存在");return;}
      if(!catChildren[p])catChildren[p]=[];
      catChildren[p].push(nm);
      expandedCats[p]=true;
      buildCats();renderCatManage();renderAdminGrid();
      alert("已创建子分类「"+p+" → "+nm+"」，记得点「保存更改」");
    });
  });
  el.catManageList.querySelectorAll(".cm-up").forEach(function(b){
    b.addEventListener("click",function(){
      var c=b.closest(".cat-manage-row").dataset.cat;
      var seq, idx;
      if(isChildCat(c)){
        var p=parentOf(c); seq=catChildren[p]; idx=seq.indexOf(c);
      }else{
        seq=parentSeq(); idx=seq.indexOf(c);
      }
      if(idx<=0)return;
      var t=seq[idx];seq[idx]=seq[idx-1];seq[idx-1]=t;
      if(!isChildCat(c)) catOrder=seq.slice();
      renderCatManage();buildCats();
    });
  });
  el.catManageList.querySelectorAll(".cm-down").forEach(function(b){
    b.addEventListener("click",function(){
      var c=b.closest(".cat-manage-row").dataset.cat;
      var seq, idx;
      if(isChildCat(c)){
        var p=parentOf(c); seq=catChildren[p]; idx=seq.indexOf(c);
      }else{
        seq=parentSeq(); idx=seq.indexOf(c);
      }
      if(idx<0||idx>=seq.length-1)return;
      var t=seq[idx];seq[idx]=seq[idx+1];seq[idx+1]=t;
      if(!isChildCat(c)) catOrder=seq.slice();
      renderCatManage();buildCats();
    });
  });
  el.catManageList.querySelectorAll(".cm-rename").forEach(function(b){
    b.addEventListener("click",function(){
      var row=b.closest(".cat-manage-row");
      var oldC=row.dataset.cat, newC=row.querySelector(".cm-name").value.trim();
      if(!newC){alert("分类名不能为空");return;}
      if(oldC===newC) return;
      if(catList.indexOf(newC)>=0&&newC!==oldC){alert("分类「"+newC+"」已存在");return;}
      if(isChildCat(oldC)){
        var p=parentOf(oldC), ci2=catChildren[p].indexOf(oldC);
        catChildren[p][ci2]=newC;
      }else if(catChildren[oldC]){
        catChildren[newC]=catChildren[oldC];delete catChildren[oldC];
      }
      var ei=catOrder.indexOf(oldC);
      if(ei>=0) catOrder[ei]=newC;
      var bi=catBold.indexOf(oldC);
      if(bi>=0) catBold[bi]=newC;
      if(expandedCats[oldC]){expandedCats[newC]=true;delete expandedCats[oldC];}
      ms.forEach(function(m){ if((m.cat||"未分类")===oldC){ m.cat=newC; } });
      renderCatManage(); renderCatSidebar(); buildCats(); renderAdminGrid();
      alert("已重命名为「"+newC+"」，记得点「保存更改」同步云端");
    });
  });
  el.catManageList.querySelectorAll(".cm-del").forEach(function(b){
    b.addEventListener("click",function(){
      var row=b.closest(".cat-manage-row");
      var c=row.dataset.cat;
      var isChild=isChildCat(c);
      var n=isChild? ms.filter(function(m){return m.cat===c;}).length : catTotal(c);
      var msg;
      if(isChild){ msg="删除子分类「"+c+"」？"+n+" 张照片将归入「"+parentOf(c)+"」"; }
      else if(catChildren[c]){ msg="删除分类「"+c+"」及其 "+getChildCats(c).length+" 个子分类？"+n+" 张照片将归入「未分类」"; }
      else { msg=n>0?("删除分类「"+c+"」？"+n+" 张照片将归入「未分类」"):("删除空分类「"+c+"」？"); }
      if(!confirm(msg))return;
      if(isChild){
        var p=parentOf(c), ci2=catChildren[p].indexOf(c);
        catChildren[p].splice(ci2,1);
        ms.forEach(function(m){ if(m.cat===c){ m.cat=p; } });
      }else{
        getChildCats(c).forEach(function(sc){
          var bi2=catBold.indexOf(sc); if(bi2>=0) catBold.splice(bi2,1);
          ms.forEach(function(m){ if(m.cat===sc){ m.cat="未分类"; } });
        });
        delete catChildren[c];
        ms.forEach(function(m){ if((m.cat||"未分类")===c){ m.cat="未分类"; } });
      }
      var ei=catOrder.indexOf(c);
      if(ei>=0) catOrder.splice(ei,1);
      var bi=catBold.indexOf(c);
      if(bi>=0) catBold.splice(bi,1);
      delete expandedCats[c];
      renderCatManage(); renderCatSidebar(); buildCats(); renderAdminGrid();
      alert("已删除分类，记得点「保存更改」同步云端");
    });
  });
}
var catSelects=[],catSelectBound=false;
function closeCatSelects(){catSelects.forEach(function(w){w.root.classList.remove("open");});}
function bindCatSelectGlobals(){
  if(catSelectBound)return;catSelectBound=true;
  document.addEventListener("click",function(e){
    var inside=false;
    catSelects.forEach(function(w){if(w.root.contains(e.target))inside=true;});
    if(!inside)closeCatSelects();
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeCatSelects();});
}
function makeCatSelect(container,initial,onChange,getOptions){
  bindCatSelectGlobals();
  var val=initial||"未分类";
  var root=document.createElement("div");
  root.className="cat-select";
  var btn=document.createElement("button");
  btn.type="button";btn.className="cat-select-trigger";
  var menu=document.createElement("div");
  menu.className="cat-select-menu";
  root.appendChild(btn);root.appendChild(menu);
    function render(){
    btn.textContent=val+" ▾";
    menu.innerHTML="";
    function addItem(label,cls,v){
      var it=document.createElement("div");
      it.className="cat-select-item"+(cls||"")+(v===val?" selected":"");
      it.textContent=label;
      it.addEventListener("click",function(){
        val=v;render();
        closeCatSelects();
        if(onChange)onChange(val);
      });
      menu.appendChild(it);
    }
    var opts=getOptions?getOptions():null;
    if(opts){
      opts.forEach(function(o){addItem(o.label,o.cls,o.v);});
    }else{
      catList.forEach(function(c){
        if(c==="全部")return;
        addItem(c,isChildCat(c)?" cs-child":" cs-parent",c);
      });
    }
  }
  btn.addEventListener("click",function(){
    render();
    if(root.classList.contains("open")){closeCatSelects();return;}
    closeCatSelects();
    root.classList.add("open");
  });
  container.appendChild(root);
  render();
  var api={root:root,value:function(){return val;},setValue:function(v){val=v||"未分类";render();},refresh:function(){render();}};
  catSelects.push(api);
  return api;
}
function makeCatPair(container,initial,onChange){
  var pDiv=document.createElement("div");
  pDiv.className="cat-pair-parent";
  var cDiv=document.createElement("div");
  cDiv.className="cat-pair-child";
  cDiv.style.display="none";
  container.appendChild(pDiv);
  container.appendChild(cDiv);
  var childVal="";
  var cSel=null;
  var pSel=makeCatSelect(pDiv,"未分类",function(){
    syncChild();
    if(onChange)onChange(value());
  },function(){
    var opts=[{v:"未分类",label:"未分类",cls:""}];
    catList.forEach(function(c){
      if(c==="全部"||c==="未分类"||isChildCat(c))return;
      opts.push({v:c,label:c,cls:"cs-parent"});
    });
    return opts;
  });
  function childOpts(){
    var p=pSel.value();
    var kids=getChildCats(p);
    if(!kids.length)return null;
    var opts=[{v:"",label:"（不选，归入「"+p+"」）",cls:""}];
    kids.forEach(function(k){opts.push({v:k,label:k,cls:"cs-child"});});
    return opts;
  }
  function syncChild(){
    var kids=getChildCats(pSel.value());
    var show=kids.length>0;
    cDiv.style.display=show?"block":"none";
    if(show){
      if(!cSel){
        cSel=makeCatSelect(cDiv,childVal,function(cv){childVal=cv;if(onChange)onChange(value());},childOpts);
      }else{
        childVal="";
        cSel.setValue("");
        cSel.refresh();
      }
    }else{
      childVal="";
    }
  }
  function value(){
    if(cSel&&cSel.value())return cSel.value();
    return pSel.value();
  }
  function setValue(v){
    if(isChildCat(v)){
      childVal=v;
      pSel.setValue(parentOf(v)||"未分类");
    }else{
      childVal="";
      pSel.setValue(v||"未分类");
    }
    syncChild();
  }
  setValue(initial||"未分类");
  return {root:container,value:value,setValue:setValue,refresh:function(){pSel.refresh();if(cSel)cSel.refresh();}};
}

function updateDisplay(){
  view=viewMs();
  if(!view.length) return;
  var m=view[ci], t=view.length;
  el.counter.innerHTML = (ci+1)+"/"+t;
  el.photoTitle.textContent = m.title;
  el.photoDate.textContent = formatDate(m.date);
  el.yearLabel.textContent = (m.date?new Date(m.date).getFullYear():"").toString().split("").join(" ");
  el.currentImg.src = m.url;
  var rot = m.rotate||0;
  el.currentImg.style.transform = "rotate("+rot+"deg)";
  el.currentImg.style.filter = "sepia(0.15)saturate(0.85)contrast(1.05)";
  if(rot%180===0){
    el.mainImage.style.height="100%";
    el.mainImage.style.width="";
    el.mainImage.style.maxWidth="78%";
    el.photoFrame.style.padding="10px 10px 28px 10px";
  }else{
    el.mainImage.style.height="";
    el.mainImage.style.width="72%";
    el.mainImage.style.maxWidth="1000px";
    el.photoFrame.style.padding="6px 14px 6px 14px";
  }
  var pi=(ci-1+t)%t, ni=(ci+1)%t;
  el.prevImg.src = view[pi].url;
  el.nextImg.src = view[ni].url;
  var y=m.date?new Date(m.date).getFullYear():0;
  var fl="sepia(0.15)saturate(0.85)contrast(1.05)";
  if(y&&y<2000) fl="sepia(0.55)saturate(0.6)brightness(0.85)contrast(1.1)";
  else if(y&&y<2010) fl="sepia(0.35)saturate(0.75)brightness(0.9)contrast(1.05)";
  else if(y&&y<2020) fl="sepia(0.2)saturate(0.85)brightness(0.95)contrast(1.05)";
  el.currentImg.style.filter=fl;
  var sh=(ci/Math.max(t-1,1))*30-15;
  el.bgLayer.style.transform="translate("+sh+"px,"+(sh*0.3)+"px) scale(1.1)";
  el.timelineDots.querySelectorAll(".timeline-dot").forEach(function(d,i){d.classList.toggle("active",i===ci);});
}

function renderTimeline(){
  el.timelineDots.innerHTML="";
  viewMs().forEach(function(m,i){
    var d=document.createElement("div");
    d.className="timeline-dot"+(i===ci?" active":"");
    d.dataset.idx=i;
    var y=m.date?new Date(m.date).getFullYear():"";
    var l=document.createElement("span"); l.className="dot-year"; l.textContent=y;
    d.appendChild(l);
    d.addEventListener("click",function(){goTo(parseInt(this.dataset.idx));});
    el.timelineDots.appendChild(d);
  });
}

function goTo(i){
  view=viewMs();
  if(!view.length) return;
  i=((i%view.length)+view.length)%view.length;
  if(i===ci) return;
  ci=i;
  var fr=el.photoFrame;
  fr.style.transition="none"; fr.style.transform="scale(1.08)"; fr.style.opacity="0.3"; fr.style.filter="blur(5px)";
  el.currentImg.src=view[ci].url; void fr.offsetHeight;
  fr.style.transition="transform 0.55s cubic-bezier(0.22,0.61,0.36,1),opacity 0.5s,filter 0.5s";
  fr.style.transform=""; fr.style.opacity=""; fr.style.filter="";
  updateDisplay(); renderTimeline(); randomEffect();
}

function nextImg(){goTo(ci+1);}
function prevImg(){goTo(ci-1);}
function formatDate(d){if(!d)return"";var dt=new Date(d);return dt.getFullYear()+"."+String(dt.getMonth()+1).padStart(2,"0");}

// ===== Password Verification =====
function showPwdModal(cb){
  pwdCallback = cb;
  el.pwdInput.value = "";
  el.pwdErr.textContent = "";
  el.pwdOverlay.classList.add("open");
  setTimeout(function(){ el.pwdInput.focus(); }, 100);
}

function closePwdModal(){ el.pwdOverlay.classList.remove("open"); pwdCallback = null; }

el.pwdSubmit.addEventListener("click", function(){
  var pwd = el.pwdInput.value;
  if(!pwd){ el.pwdErr.textContent = "请输入密码"; return; }

  el.pwdErr.textContent = "正在验证...";

  var xhr = new XMLHttpRequest();
  xhr.open("POST", SUPABASE_URL + "/auth/v1/token?grant_type=password", true);
  xhr.setRequestHeader("apikey", SUPABASE_KEY);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onload = function(){
    if(xhr.status === 200){
      try {
        var res = JSON.parse(xhr.responseText);
        AUTH_TOKEN = res.access_token; // 验证成功！拿到真正的登录 Token
        var cb = pwdCallback;
        closePwdModal();
        if(cb) cb();
      } catch(e){
        el.pwdErr.textContent = "登录解析异常";
      }
    } else {
      el.pwdErr.textContent = "密码错误，请重试";
      el.pwdInput.value = "";
      el.pwdInput.focus();
    }
  };
  xhr.onerror = function(){
    el.pwdErr.textContent = "网络请求失败";
  };
  xhr.send(JSON.stringify({
    email: ADMIN_EMAIL,
    password: pwd
  }));
});

el.pwdCancel.addEventListener("click", closePwdModal);
el.pwdOverlay.addEventListener("click", function(e){ if(e.target === e.currentTarget) closePwdModal(); });
el.pwdInput.addEventListener("keydown", function(e){
  if(e.key === "Enter") el.pwdSubmit.click();
  else if(e.key === "Escape") closePwdModal();
});

el.submitBtn.addEventListener("click",function(){
  var title=el.titleInput.value.trim()||"未命名";
  var date=el.dateInput.value;
  if(!selectedFiles.length){alert("请先选择图片");return;}
  var total=selectedFiles.length,done=0,failed=0,idx=0;
  var cat=(el.catInput&&el.catInput._sel)?(el.catInput._sel.value()||"未分类"):"未分类";
  el.submitBtn.textContent="处理中 0/"+total; el.submitBtn.disabled=true;
  el.compressingOverlay.classList.add("show");
  function next(){
    if(idx>=total){
      el.compressingOverlay.classList.remove("show");
      if(done>0){
        saveManifest(function(){
          renderTimeline(); goTo(ms.length-1);
          closeUpload(); el.submitBtn.textContent="确定上传"; el.submitBtn.disabled=false;
          selectedFiles=[]; el.fileInput.value="";
          if(failed>0) alert("批量上传完成：成功 "+done+" 张，失败 "+failed+" 张");
        });
      }else{
        el.submitBtn.textContent="确定上传"; el.submitBtn.disabled=false;
        selectedFiles=[]; el.fileInput.value="";
        alert("上传失败："+failed+" 张图片均未成功");
      }
      return;
    }
    var f=selectedFiles[idx];
    el.compressingText.textContent="正在处理 "+(idx+1)+"/"+total;
    el.submitBtn.textContent="处理中 "+(idx+1)+"/"+total;
    compressImage(f,function(err,cf,mb){
      if(err){failed++;idx++;next();return;}
      el.compressingText.textContent="正在上传 "+(idx+1)+"/"+total;
      el.submitBtn.textContent="上传中 "+(idx+1)+"/"+total;
      uploadToSupabase(cf,function(err2,url){
        if(err2){failed++;}else{
          done++;
          var t=(total===1)?title:f.name.replace(/\..+$/,"");
          ms.push({id:"m"+Date.now()+"_"+idx, title:t, date:date, url:url, cat:cat});
        }
        idx++; next();
      });
    });
  }
  next();
});

// ===== Admin =====
function openAdmin(){showPwdModal(function(){renderAdminGrid();renderCatManage();el.adminPanel.classList.add("open");});}
function closeAdmin(){el.adminPanel.classList.remove("open");}

function renderAdminGrid(){
  el.adminGrid.innerHTML="";
  ms.forEach(function(m,i){
    var c=document.createElement("div");
    c.className="admin-card"; c.dataset.idx=i;
    c.innerHTML='<div class="admin-card-thumb"><img src="'+he(m.url)+'"></div>'+
      '<div class="admin-card-fields">'+
      '<input class="at" value="'+he(m.title)+'" placeholder="标题">'+
      '<div style="display:flex;gap:6px"><input class="ad" type="date" value="'+he(m.date||"")+'" style="flex:1">'+
      '<input class="ai" type="number" value="'+(i+1)+'" min="1" max="'+ms.length+'" style="width:50px"></div>'+
      '<div class="ac"></div></div>'+
      '<div class="admin-card-actions"><button class="up-btn" data-i="'+i+'">&#8593;</button>'+
      '<button class="down-btn" data-i="'+i+'">&#8595;</button>'+
      '<button class="rot-l-btn" data-i="'+i+'">&#8630;</button>'+
      '<button class="rot-r-btn" data-i="'+i+'">&#8631;</button>'+
      '<button class="del-btn" data-i="'+i+'">&#10005;</button></div>';
    el.adminGrid.appendChild(c);
    var acDiv=c.querySelector(".ac");
    if(acDiv){acDiv._sel=makeCatPair(acDiv,m.cat||"未分类",function(v){m.cat=v;renderCatManage();});}
  });
  el.adminGrid.querySelectorAll(".up-btn").forEach(function(b){
    b.addEventListener("click",function(){
      var idx=parseInt(this.dataset.i);
      if(idx<=0)return;
      var t=ms[idx];ms[idx]=ms[idx-1];ms[idx-1]=t;
      renderAdminGrid(); renderTimeline(); updateDisplay();
    });
  });
  el.adminGrid.querySelectorAll(".down-btn").forEach(function(b){
    b.addEventListener("click",function(){
      var idx=parseInt(this.dataset.i);
      if(idx>=ms.length-1)return;
      var t=ms[idx];ms[idx]=ms[idx+1];ms[idx+1]=t;
      renderAdminGrid(); renderTimeline(); updateDisplay();
    });
  });
  el.adminGrid.querySelectorAll(".rot-l-btn").forEach(function(b){b.addEventListener("click",function(){var idx=parseInt(this.dataset.i);ms[idx].rotate=(ms[idx].rotate||0)-90;renderAdminGrid();});});
  el.adminGrid.querySelectorAll(".rot-r-btn").forEach(function(b){b.addEventListener("click",function(){var idx=parseInt(this.dataset.i);ms[idx].rotate=(ms[idx].rotate||0)+90;renderAdminGrid();});});
  el.adminGrid.querySelectorAll(".admin-card-thumb").forEach(function(t){t.addEventListener("click",function(){var idx=parseInt(t.closest(".admin-card").dataset.idx);openPreview(idx);});});
  el.adminGrid.querySelectorAll(".del-btn").forEach(function(b){
    b.addEventListener("click",function(){
      deleteTarget=parseInt(this.dataset.i);
      el.confirmMsg.textContent="确定要删除「"+ms[deleteTarget].title+"」吗？";
      el.confirmDialog.classList.add("open");
    });
  });
}

function removeFromSupabase(m){
  // 【安全加固】删除云端图片必须携带登录后的 AUTH_TOKEN
  // 未登录直接拒绝（原来用公开的 anon key，RLS 已禁止匿名删除）
  if(!AUTH_TOKEN){ alert("请先登录管理员账号再删除"); return; }
  if(!m||!m.url) return;
  var p="/object/public/"+BUCKET_NAME+"/", i=m.url.indexOf(p);
  if(i<0) return;
  var fn=m.url.substring(i+p.length).split("?")[0];
  if(!fn) return;
  var xhr=new XMLHttpRequest();
  xhr.open("DELETE",STORAGE_URL+"/object/"+BUCKET_NAME+"/"+fn,true);
  // 【安全加固】用登录 token 替代公开的 anon key 发送删除请求
  xhr.setRequestHeader("Authorization","Bearer "+AUTH_TOKEN);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.onload=function(){
    if(xhr.status>=200&&xhr.status<300){
      try{console.log("cloud deleted: "+fn);}catch(e){}
    }else{
      try{alert("记录已删除，但云端图片删除失败("+xhr.status+")，请到 Supabase 控制台手动清理: "+fn);}catch(e){}
    }
  };
  xhr.onerror=function(){
    try{alert("网络异常，云端图片未能自动删除，请到 Supabase 控制台手动清理: "+fn);}catch(e){}
  };
  xhr.send(JSON.stringify([fn]));
}

el.confirmOk.addEventListener("click",function(){

function he(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ===== Effects =====
function randomEffect(){var fx=[lightLeak,bokehEffect,sparkleEffect,shutterFlash];fx[Math.floor(Math.random()*fx.length)]();}
function lightLeak(){
  var lk=el.lightLeak; var h=15+Math.random()*40,x=10+Math.random()*80,y=20+Math.random()*60;

function bokehEffect(){
  for(var i=0;i<6;i++){
    var c=document.createElement("div");
    c.style.cssText="position:fixed;z-index:49;pointer-events:none;border-radius:50%;opacity:0;animation:bokehFade "+(0.6+Math.random()*0.8)+"s ease-out forwards;background:radial-gradient(circle at 30% 30%,hsla("+(30+Math.random()*30)+",40%,70%,0.2),transparent)";
    var sz=20+Math.random()*80;c.style.width=sz+"px";c.style.height=sz+"px";
    c.style.left=(Math.random()*100)+"%";c.style.top=(Math.random()*100)+"%";
    document.body.appendChild(c);
    setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},2000);
  }
}
function sparkleEffect(){
  for(var i=0;i<8;i++){
    var s=document.createElement("div");
    s.style.cssText="position:fixed;z-index:49;pointer-events:none;border-radius:50%;opacity:0;animation:sparkleFade "+(0.5+Math.random()*0.6)+"s ease-out forwards";
    var sz=2+Math.random()*4;s.style.width=sz+"px";s.style.height=sz+"px";
    s.style.left=(Math.random()*100)+"%";s.style.top=(Math.random()*100)+"%";
    s.style.background="hsla("+(35+Math.random()*20)+",60%,80%,0.5)";
    document.body.appendChild(s);
    setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1500);
  }
}
function shutterFlash(){
  var sf=el.shutterFlash;sf.style.background="rgba(255,255,255,0.03)";sf.style.opacity="1";
  setTimeout(function(){sf.style.opacity="0";},50);
}

// ===== Particles =====
function startParticles(){
  var c=el.particleCanvas;if(!c)return;
  c.width=window.innerWidth;c.height=window.innerHeight;
  var cx=c.getContext("2d");var ps=[];
  for(var i=0;i<30;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,sz:Math.random()*2+0.5,sx:(Math.random()-0.5)*0.12,sy:-(Math.random()*0.08+0.02),op:Math.random()*0.2+0.03,hu:30+Math.random()*20});
  (function an(){cx.clearRect(0,0,c.width,c.height);
    ps.forEach(function(p){p.x+=p.sx;p.y+=p.sy;if(p.y<-10){p.y=c.height+10;p.x=Math.random()*c.width;}if(p.x<-10)p.x=c.width+10;if(p.x>c.width+10)p.x=-10;
    cx.beginPath();cx.arc(p.x,p.y,p.sz,0,Math.PI*2);cx.fillStyle="hsla("+p.hu+",40%,70%,"+p.op+")";cx.fill();
    cx.beginPath();cx.arc(p.x,p.y,p.sz*3,0,Math.PI*2);cx.fillStyle="hsla("+p.hu+",40%,70%,"+(p.op*0.1)+")";cx.fill();});
    requestAnimationFrame(an);})();
}

// ===== Events =====
function bindEvents(){
  document.addEventListener("wheel",function(e){if(el.uploadModal.classList.contains("open")||el.adminPanel.classList.contains("open")||el.confirmDialog.classList.contains("open"))return;e.preventDefault();if(e.deltaY>0)nextImg();else prevImg();},{passive:false});
  document.addEventListener("keydown",function(e){
    if(el.uploadModal.classList.contains("open")||el.adminPanel.classList.contains("open")||el.confirmDialog.classList.contains("open"))return;
    if(e.key==="ArrowLeft"||e.key==="ArrowUp")prevImg();else if(e.key==="ArrowRight"||e.key==="ArrowDown")nextImg();});
  el.navPrev.addEventListener("click",prevImg);el.navNext.addEventListener("click",nextImg);
  window.addEventListener("resize",function(){var c=el.particleCanvas;if(c){c.width=window.innerWidth;c.height=window.innerHeight;}});
  // Touch swipe for mobile
  var tx=0,ty=0;
  document.addEventListener("touchstart",function(e){
    if(el.uploadModal.classList.contains("open")||el.adminPanel.classList.contains("open")||el.confirmDialog.classList.contains("open")||el.compressingOverlay.classList.contains("show")||el.previewOverlay.classList.contains("open")){tx=0;return}
    tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(tx===0)return;
    var dx=tx-e.changedTouches[0].screenX,dy=ty-e.changedTouches[0].screenY;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){if(dx>0)nextImg();else prevImg()}
    tx=0;
  },{passive:true});

  // ===== 分类侧边栏开关 =====
  el.catToggle.addEventListener("click",toggleCatDrawer);
  el.catMask.addEventListener("click",closeCatDrawer);
  el.catCreateBtn.addEventListener("click",function(){
    var n=el.catNewName.value.trim();
    if(!n){alert("请输入分类名称");return;}
    if(catList.indexOf(n)>=0){alert("分类「"+n+"」已存在");return;}
    catOrder.push(n);
    el.catNewName.value="";
    buildCats(); renderCatManage(); renderAdminGrid();
    alert("已创建分类「"+n+"」，可在下方照片管理中选择，记得点「保存更改」");
  });
}

document.addEventListener("DOMContentLoaded",init);
})();
